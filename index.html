<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zastávkobraní Alpha</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyo3cL3i/a3kD3I=" crossorigin="">
<link rel="stylesheet" href="style.css"></head><body>
<header><strong>🚏 Zastávkobraní <small>ALPHA</small></strong><span style="flex:1"></span><label for="player">Hráč</label><select id="player"></select><button id="reset" title="Vymaže lokální testovací hru">Reset testu</button></header>
<div class="banner">TESTOVACÍ VERZE · 3 hráči a společná lokální data. Ukázkové zastávky · simulace bez GPS.</div>
<main><div id="map" role="region" aria-label="Mapa zastávek"></div><aside>
<div class="card"><div class="eyebrow">Aktivní profil</div><h2 id="profile"></h2><div class="stats"><div class="stat"><b id="remaining">3/3</b><span>Obsazení zbývá</span></div><div class="stat"><b id="owned">0</b><span>Vlastní území</span></div><div class="stat"><b id="points">0</b><span>Body celkem</span></div></div><p class="notice" id="clock"></p></div>
<div class="card"><div class="eyebrow">Vybraná zastávka</div><h2 id="stopname">Vyber zastávku na mapě</h2><div id="stopdetail" class="muted">Klikni na značku na mapě.</div><div class="actions"><button class="primary" id="capture" disabled>Obsadit / převzít</button><button id="maintain" disabled>Udržet</button></div><div id="message" aria-live="polite"></div></div>
<div class="card"><div class="eyebrow">Zastávka dne</div><h2 id="challenge"></h2><div id="challengeinfo" class="notice"></div><button id="visit" disabled>Splnit návštěvu</button></div>
<div class="card"><div class="eyebrow">Žebříček · 30 herních dní</div><div id="leaderboard"></div></div>
<div class="card"><div class="eyebrow">Nedávné události</div><div id="events" class="notice"></div></div>
</aside></main>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js" defer></script></body></html>
