<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Zastávkobraní Alpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=alpha-20261119-1745-mapfix">
</head>
<body>
<div id="map" role="region" aria-label="Mapa herních zastávek Prahy"></div><div id="map-error" class="map-error" hidden></div>
<header class="topbar">
  <div class="brand">Zastávkobraní <small>ALPHA</small></div>
  <label class="player-choice"><span>Hráč</span><select id="player" aria-label="Testovací hráč"></select></label>
</header>
<button id="gps-toggle" class="gps-toggle" type="button" aria-pressed="false" title="Zapnout GPS">◎ <span>Zapnout GPS</span></button>
<div id="gps-status" class="gps-status" role="status" aria-live="polite" hidden></div>
<div class="test-label">ALPHA 0.4 · 12 ukázkových zastávek · GPS orientační</div>
<nav class="nav" aria-label="Herní nabídka">
  <button type="button" data-screen="map" class="active">Mapa</button>
  <button type="button" data-screen="daily">Zastávka dne</button>
  <button type="button" data-screen="ranking">Pořadí</button>
  <button type="button" data-screen="profile">Profil</button>
</nav>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden aria-label="Herní panel">
  <div class="sheet-head"><span class="grabber"></span><button class="close" id="close" aria-label="Zavřít panel">×</button></div>
  <div class="screen" id="screen-stop">
    <div class="eyebrow">Herní zastávka</div>
    <h1 id="stopname">Zastávka</h1>
    <div id="stopdetail" class="details"></div>
    <div class="actions"><button class="primary" id="capture" disabled>Obsadit</button><button id="maintain" disabled>Udržet</button></div>
    <p id="message" class="message" aria-live="polite"></p>
  </div>
  <div class="screen" id="screen-daily" hidden>
    <div class="eyebrow">Denní výzva</div><h1>Zastávka dne</h1>
    <h2 id="challenge"></h2><p id="challengeinfo" class="muted"></p>
    <button id="show-challenge" class="primary">Ukázat na mapě</button>
    <button id="visit" disabled>Splnit návštěvu</button>
  </div>
  <div class="screen" id="screen-ranking" hidden>
    <div class="eyebrow">Posledních 30 herních dní</div><h1>Pořadí hráčů</h1>
    <div id="leaderboard"></div>
  </div>
  <div class="screen" id="screen-profile" hidden>
    <div class="eyebrow">Testovací účet</div><h1 id="profile">Hráč</h1>
    <div class="stats">
      <div><strong id="remaining">3/3</strong><span>Obsazení zbývá</span></div>
      <div><strong id="owned">0</strong><span>Moje zastávky</span></div>
      <div><strong id="points">0</strong><span>Celkem bodů</span></div>
    </div>
    <p id="clock" class="muted"></p>
    <div class="eyebrow">Nedávné události</div><div id="events" class="events"></div>
    <button id="reset" class="danger">Resetovat testovací hru</button>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="map-style.js?v=alpha-20261119-1745-mapfix"></script>
<script src="app.js?v=alpha-20261119-1745-mapfix" defer></script>
</body></html>
