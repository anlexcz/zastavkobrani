name: Verify Zastavkobrani Alpha
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check stop-map.js
          node --check map-style.js
          node --check pid-prague.js
      - name: Data and map unit tests
        run: node --test tests/*.test.cjs
